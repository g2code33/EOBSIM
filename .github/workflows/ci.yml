name: Source checks (no application build)

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    name: Static checks and integrity tests — no deliverable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run source checks
        run: |
          node --test tests/update-integrity.test.mjs tests/preview-calculator.test.mjs
          python -m unittest discover -s tests -v
      - name: Explain scope
        if: always()
        run: |
          echo '## Source checks only' >> "$GITHUB_STEP_SUMMARY"
          echo 'No executable, web bundle, native package, or release artifact was built or tested.' >> "$GITHUB_STEP_SUMMARY"
